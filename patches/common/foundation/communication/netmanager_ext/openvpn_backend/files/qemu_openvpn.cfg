{
    "jobs": [
        {
            "name": "services:qemu_openvpn",
            "cmds": [
                "mkdir /data/service/el1/public/vpn/qemu_openvpn 0700 netsysnative netsysnative",
                "restorecon /data/service/el1/public/vpn/qemu_openvpn"
            ]
        }
    ],
    "services": [
        {
            "name": "qemu_openvpn",
            "path": ["/system/bin/qemu_openvpn_service"],
            "uid": "netsysnative",
            "gid": ["netsysnative", "netsys_socket", "dev_tun_access"],
            "secon": "u:r:netsysnative:s0",
            "disabled": 1,
            "once": 1,
            "jobs": {"on-start": "services:qemu_openvpn"}
        }
    ]
}
